<svg width="550" height="462" viewBox="0 0 500 420" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="420" fill="#1a1a2e"/>

  <!-- Grid circles -->
  <circle cx="250" cy="210" r="150" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <circle cx="250" cy="210" r="112.5" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <circle cx="250" cy="210" r="75" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <circle cx="250" cy="210" r="37.5" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Axis lines (5 axes for pentagon) -->
  <!-- Pentagon vertices at: -90°, -18°, 54°, 126°, 198° from center (250, 210) -->
  <line x1="250" y1="210" x2="250" y2="60" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="250" y1="210" x2="392.66" y2="163.65" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="250" y1="210" x2="338.17" y2="331.35" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="250" y1="210" x2="161.83" y2="331.35" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="250" y1="210" x2="107.34" y2="163.65" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- TradFi data (gray - innermost) -->
  <!-- Scores: 透明度40, 可组合性30, 结算速度35, 创新性45, 去中心化20 -->
  <polygon points="250,150 292.80,196.09 280.86,252.47 210.32,264.61 221.47,200.73"
           fill="rgba(149,165,166,0.3)" stroke="#95A5A6" stroke-width="3" stroke-linejoin="round"/>

  <!-- Pendle data (purple - middle) -->
  <!-- Scores: 透明度85, 可组合性75, 结算速度95, 创新性80, 去中心化70 -->
  <polygon points="250,82.50 356.99,175.24 333.76,325.28 179.47,307.08 150.14,177.55"
           fill="rgba(156,39,176,0.25)" stroke="#9C27B0" stroke-width="3" stroke-linejoin="round"/>

  <!-- Strata data (blue - outermost) -->
  <!-- Scores: 透明度95, 可组合性90, 结算速度95, 创新性92, 去中心化95 -->
  <polygon points="250,67.50 378.39,168.28 333.76,325.28 168.89,321.64 114.47,165.97"
           fill="rgba(45,91,255,0.3)" stroke="#2D5BFF" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Dimension labels with better positioning -->
  <text x="250" y="45" text-anchor="middle" fill="#F1C40F" font-size="16" font-weight="700" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">透明度</text>
  <text x="415" y="170" text-anchor="start" fill="#F1C40F" font-size="16" font-weight="700" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">可组合性</text>
  <text x="350" y="365" text-anchor="middle" fill="#F1C40F" font-size="16" font-weight="700" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">结算速度</text>
  <text x="150" y="365" text-anchor="middle" fill="#F1C40F" font-size="16" font-weight="700" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">创新性</text>
  <text x="85" y="170" text-anchor="end" fill="#F1C40F" font-size="16" font-weight="700" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">去中心化</text>

  <!-- Data points for better visibility -->
  <!-- Strata points -->
  <circle cx="250" cy="67.50" r="4" fill="#2D5BFF"/>
  <circle cx="378.39" cy="168.28" r="4" fill="#2D5BFF"/>
  <circle cx="333.76" cy="325.28" r="4" fill="#2D5BFF"/>
  <circle cx="168.89" cy="321.64" r="4" fill="#2D5BFF"/>
  <circle cx="114.47" cy="165.97" r="4" fill="#2D5BFF"/>

  <!-- Pendle points -->
  <circle cx="250" cy="82.50" r="3.5" fill="#9C27B0"/>
  <circle cx="356.99" cy="175.24" r="3.5" fill="#9C27B0"/>
  <circle cx="333.76" cy="325.28" r="3.5" fill="#9C27B0"/>
  <circle cx="179.47" cy="307.08" r="3.5" fill="#9C27B0"/>
  <circle cx="150.14" cy="177.55" r="3.5" fill="#9C27B0"/>

  <!-- TradFi points -->
  <circle cx="250" cy="150" r="3" fill="#95A5A6"/>
  <circle cx="292.80" cy="196.09" r="3" fill="#95A5A6"/>
  <circle cx="280.86" cy="252.47" r="3" fill="#95A5A6"/>
  <circle cx="210.32" cy="264.61" r="3" fill="#95A5A6"/>
  <circle cx="221.47" cy="200.73" r="3" fill="#95A5A6"/>
</svg>


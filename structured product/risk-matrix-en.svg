<svg viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="360" height="280" fill="#1a1a2e"/>

  <!-- Optimized background areas - compress low risk, expand high risk -->
  <!-- Low risk zone (bottom left) - smaller -->
  <rect x="60" y="210" width="90" height="50" fill="rgba(76, 175, 80, 0.15)" stroke="none"/>

  <!-- Medium risk zone (middle) - moderate -->
  <rect x="60" y="120" width="90" height="90" fill="rgba(255, 152, 0, 0.15)" stroke="none"/>
  <rect x="150" y="210" width="170" height="50" fill="rgba(255, 152, 0, 0.15)" stroke="none"/>

  <!-- High risk zone (top right) - expanded -->
  <rect x="150" y="30" width="170" height="180" fill="rgba(255, 107, 107, 0.15)" stroke="none"/>
  <rect x="60" y="30" width="90" height="90" fill="rgba(255, 107, 107, 0.15)" stroke="none"/>

  <!-- Grid lines -->
  <!-- Horizontal dashed lines (Impact level: Low/Med/High) -->
  <line x1="60" y1="120" x2="320" y2="120" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="60" y1="210" x2="320" y2="210" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Vertical dashed lines (Probability: Low/Med/High) -->
  <line x1="150" y1="30" x2="150" y2="260" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="235" y1="30" x2="235" y2="260" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Axes -->
  <line x1="60" y1="30" x2="60" y2="260" stroke="rgba(255,255,255,0.5)" stroke-width="2.5"/>
  <line x1="60" y1="260" x2="320" y2="260" stroke="rgba(255,255,255,0.5)" stroke-width="2.5"/>

  <!-- Scale labels -->
  <text x="53" y="255" fill="white" font-size="15" text-anchor="end" font-weight="600" font-family="Arial, sans-serif">Low</text>
  <text x="53" y="165" fill="white" font-size="15" text-anchor="end" font-weight="600" font-family="Arial, sans-serif">Med</text>
  <text x="53" y="75" fill="white" font-size="15" text-anchor="end" font-weight="600" font-family="Arial, sans-serif">High</text>
  <text x="105" y="275" fill="white" font-size="15" text-anchor="middle" font-weight="600" font-family="Arial, sans-serif">Low</text>
  <text x="192" y="275" fill="white" font-size="15" text-anchor="middle" font-weight="600" font-family="Arial, sans-serif">Med</text>
  <text x="277" y="275" fill="white" font-size="15" text-anchor="middle" font-weight="600" font-family="Arial, sans-serif">High</text>

  <!-- Axis labels -->
  <text x="190" y="18" fill="#F1C40F" font-size="18" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">Probability →</text>
  <text x="18" y="145" fill="#F1C40F" font-size="18" font-weight="700" text-anchor="middle" transform="rotate(-90, 18, 145)" font-family="Arial, sans-serif">Impact →</text>

  <!-- Risk points - repositioned to optimized coordinate system -->
  <!-- 1. Strata Contract Vulnerability: Med probability, High impact - Red -->
  <circle cx="190" cy="60" r="10" fill="#FF6B6B" stroke="white" stroke-width="2.5"/>
  <text x="190" y="66" fill="white" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">1</text>

  <!-- 2. Pendle AMM Vulnerability: Med probability, Med-High impact - Orange -->
  <circle cx="190" cy="105" r="10" fill="#FF9800" stroke="white" stroke-width="2.5"/>
  <text x="190" y="111" fill="white" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">2</text>

  <!-- 3. Oracle Attack: High probability, High impact - Red -->
  <circle cx="270" cy="50" r="10" fill="#FF6B6B" stroke="white" stroke-width="2.5"/>
  <text x="270" y="56" fill="white" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">3</text>

  <!-- 4. Governance Attack: Low probability, Med impact - Green -->
  <circle cx="105" cy="165" r="10" fill="#4CAF50" stroke="white" stroke-width="2.5"/>
  <text x="105" y="171" fill="white" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">4</text>

  <!-- 5. Liquidity Risk: Med probability, Med impact - Orange -->
  <circle cx="190" cy="165" r="10" fill="#FF9800" stroke="white" stroke-width="2.5"/>
  <text x="190" y="171" fill="white" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">5</text>

  <!-- 6. Regulatory Risk: High probability, Med-High impact - Red -->
  <circle cx="290" cy="95" r="10" fill="#FF6B6B" stroke="white" stroke-width="2.5"/>
  <text x="290" y="101" fill="white" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">6</text>
</svg>


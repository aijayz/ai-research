<svg viewBox="0 0 340 280" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="340" height="280" fill="#1a1a2e"/>

  <!-- 优化后的背景区域 - 压缩低风险区，扩大高风险区 -->
  <!-- 低风险区 (左下) - 缩小 -->
  <rect x="50" y="210" width="90" height="50" fill="rgba(76, 175, 80, 0.15)" stroke="none"/>

  <!-- 中风险区 (中间) - 适中 -->
  <rect x="50" y="120" width="90" height="90" fill="rgba(255, 152, 0, 0.15)" stroke="none"/>
  <rect x="140" y="210" width="170" height="50" fill="rgba(255, 152, 0, 0.15)" stroke="none"/>

  <!-- 高风险区 (右上) - 扩大 -->
  <rect x="140" y="30" width="170" height="180" fill="rgba(255, 107, 107, 0.15)" stroke="none"/>
  <rect x="50" y="30" width="90" height="90" fill="rgba(255, 107, 107, 0.15)" stroke="none"/>

  <!-- 网格线 -->
  <!-- 横向虚线（影响程度分隔：低/中/高） -->
  <line x1="50" y1="120" x2="310" y2="120" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="50" y1="210" x2="310" y2="210" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- 纵向虚线（发生概率分隔：低/中/高） -->
  <line x1="140" y1="30" x2="140" y2="260" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="225" y1="30" x2="225" y2="260" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- 坐标轴 -->
  <line x1="50" y1="30" x2="50" y2="260" stroke="rgba(255,255,255,0.5)" stroke-width="2.5"/>
  <line x1="50" y1="260" x2="310" y2="260" stroke="rgba(255,255,255,0.5)" stroke-width="2.5"/>

  <!-- 刻度标签 -->
  <text x="43" y="255" fill="white" font-size="12" text-anchor="end" font-weight="600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">低</text>
  <text x="43" y="165" fill="white" font-size="12" text-anchor="end" font-weight="600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">中</text>
  <text x="43" y="75" fill="white" font-size="12" text-anchor="end" font-weight="600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">高</text>
  <text x="95" y="275" fill="white" font-size="12" text-anchor="middle" font-weight="600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">低</text>
  <text x="182" y="275" fill="white" font-size="12" text-anchor="middle" font-weight="600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">中</text>
  <text x="267" y="275" fill="white" font-size="12" text-anchor="middle" font-weight="600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">高</text>

  <!-- 轴标签 -->
  <text x="180" y="18" fill="#F1C40F" font-size="15" font-weight="700" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">发生概率 →</text>
  <text x="18" y="145" fill="#F1C40F" font-size="15" font-weight="700" text-anchor="middle" transform="rotate(-90, 18, 145)" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">影响程度 →</text>

  <!-- 风险点 - 重新定位到优化后的坐标系 -->
  <!-- 1. Strata合约漏洞: 中概率, 高影响 - 红色 -->
  <circle cx="180" cy="60" r="10" fill="#FF6B6B" stroke="white" stroke-width="2.5"/>
  <text x="180" y="66" fill="white" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">1</text>

  <!-- 2. Pendle AMM漏洞: 中概率, 中高影响 - 橙色 -->
  <circle cx="180" cy="105" r="10" fill="#FF9800" stroke="white" stroke-width="2.5"/>
  <text x="180" y="111" fill="white" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">2</text>

  <!-- 3. 预言机攻击: 高概率, 高影响 - 红色 -->
  <circle cx="260" cy="50" r="10" fill="#FF6B6B" stroke="white" stroke-width="2.5"/>
  <text x="260" y="56" fill="white" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">3</text>

  <!-- 4. 治理攻击: 低概率, 中影响 - 绿色 -->
  <circle cx="95" cy="165" r="10" fill="#4CAF50" stroke="white" stroke-width="2.5"/>
  <text x="95" y="171" fill="white" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">4</text>

  <!-- 5. 流动性风险: 中概率, 中影响 - 橙色 -->
  <circle cx="180" cy="165" r="10" fill="#FF9800" stroke="white" stroke-width="2.5"/>
  <text x="180" y="171" fill="white" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">5</text>

  <!-- 6. 监管风险: 高概率, 中高影响 - 红色 -->
  <circle cx="280" cy="95" r="10" fill="#FF6B6B" stroke="white" stroke-width="2.5"/>
  <text x="280" y="101" fill="white" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">6</text>
</svg>


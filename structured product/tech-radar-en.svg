<svg width="600" height="462" viewBox="0 0 550 420" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="550" height="420" fill="#1a1a2e"/>

  <!-- Grid circles -->
  <circle cx="275" cy="210" r="150" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <circle cx="275" cy="210" r="112.5" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <circle cx="275" cy="210" r="75" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <circle cx="275" cy="210" r="37.5" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Axis lines (5 axes for pentagon) -->
  <line x1="275" y1="210" x2="275" y2="60" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="275" y1="210" x2="417.66" y2="163.65" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="275" y1="210" x2="363.17" y2="331.35" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="275" y1="210" x2="186.83" y2="331.35" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="275" y1="210" x2="132.34" y2="163.65" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- TradFi data (gray - innermost) -->
  <!-- Scores: Transparency 40, Composability 30, Settlement Speed 35, Innovation 45, Decentralization 20 -->
  <polygon points="275,150 317.80,196.09 305.86,252.47 235.32,264.61 246.47,200.73"
           fill="rgba(149,165,166,0.3)" stroke="#95A5A6" stroke-width="3" stroke-linejoin="round"/>

  <!-- Pendle data (purple - middle) -->
  <!-- Scores: Transparency 85, Composability 75, Settlement Speed 95, Innovation 80, Decentralization 70 -->
  <polygon points="275,82.50 381.99,175.24 358.76,325.28 204.47,307.08 175.14,177.55"
           fill="rgba(156,39,176,0.25)" stroke="#9C27B0" stroke-width="3" stroke-linejoin="round"/>

  <!-- Strata data (blue - outermost) -->
  <!-- Scores: Transparency 95, Composability 90, Settlement Speed 95, Innovation 92, Decentralization 95 -->
  <polygon points="275,67.50 403.39,168.28 358.76,325.28 193.89,321.64 139.47,165.97"
           fill="rgba(45,91,255,0.3)" stroke="#2D5BFF" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Dimension labels with better positioning for English -->
  <text x="275" y="45" text-anchor="middle" fill="#F1C40F" font-size="14" font-weight="700" font-family="Arial, sans-serif">Transparency</text>
  <text x="440" y="165" text-anchor="start" fill="#F1C40F" font-size="14" font-weight="700" font-family="Arial, sans-serif">Composability</text>
  <text x="375" y="365" text-anchor="middle" fill="#F1C40F" font-size="14" font-weight="700" font-family="Arial, sans-serif">Settlement Speed</text>
  <text x="175" y="365" text-anchor="middle" fill="#F1C40F" font-size="14" font-weight="700" font-family="Arial, sans-serif">Innovation</text>
  <text x="110" y="165" text-anchor="end" fill="#F1C40F" font-size="14" font-weight="700" font-family="Arial, sans-serif">Decentralization</text>

  <!-- Data points for better visibility -->
  <!-- Strata points -->
  <circle cx="275" cy="67.50" r="4" fill="#2D5BFF"/>
  <circle cx="403.39" cy="168.28" r="4" fill="#2D5BFF"/>
  <circle cx="358.76" cy="325.28" r="4" fill="#2D5BFF"/>
  <circle cx="193.89" cy="321.64" r="4" fill="#2D5BFF"/>
  <circle cx="139.47" cy="165.97" r="4" fill="#2D5BFF"/>

  <!-- Pendle points -->
  <circle cx="275" cy="82.50" r="3.5" fill="#9C27B0"/>
  <circle cx="381.99" cy="175.24" r="3.5" fill="#9C27B0"/>
  <circle cx="358.76" cy="325.28" r="3.5" fill="#9C27B0"/>
  <circle cx="204.47" cy="307.08" r="3.5" fill="#9C27B0"/>
  <circle cx="175.14" cy="177.55" r="3.5" fill="#9C27B0"/>

  <!-- TradFi points -->
  <circle cx="275" cy="150" r="3" fill="#95A5A6"/>
  <circle cx="317.80" cy="196.09" r="3" fill="#95A5A6"/>
  <circle cx="305.86" cy="252.47" r="3" fill="#95A5A6"/>
  <circle cx="235.32" cy="264.61" r="3" fill="#95A5A6"/>
  <circle cx="246.47" cy="200.73" r="3" fill="#95A5A6"/>
</svg>

